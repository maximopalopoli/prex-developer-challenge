[package]
name = "prex-challenge"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14.1"
chrono = { version = "0.4.45", features = ["serde"] }
env_logger = "0.11.11"
log = "0.4.33"
rust_decimal = { version = "1.42.1", features = ["serde-with-arbitrary-precision"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
